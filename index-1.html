<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPC | Silica AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#090d18;color:#fff;height:100vh;display:flex}
.sidebar{width:230px;flex-shrink:0;background:#101727;padding:20px;border-right:1px solid #263249}
.logo{font-size:27px;font-weight:bold;color:#60a5fa;margin-bottom:35px}
.new-chat{width:100%;padding:13px;background:#1d2b43;color:#fff;border:1px solid #344967;border-radius:10px;cursor:pointer;font-size:15px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:20px;border-bottom:1px solid #263249;font-size:20px;font-weight:bold}
header span,.welcome h1 span{color:#60a5fa}
.chat-area{flex:1;overflow-y:auto;padding:25px;display:flex;flex-direction:column;gap:18px}
.welcome{text-align:center;margin:auto}
.welcome h1{font-size:36px;margin-bottom:12px}
.welcome p{color:#9caec7}
.message{max-width:80%;padding:14px 18px;border-radius:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:#244d83}
.ai{align-self:flex-start;background:#182438;border:1px solid #2b3b54}
.input-area{padding:16px;border-top:1px solid #263249;display:flex;gap:10px}
input{flex:1;min-width:0;padding:16px;border:1px solid #344967;background:#121d30;color:#fff;border-radius:12px;outline:none;font-size:15px}
input:focus{border-color:#60a5fa}
.send{padding:0 23px;background:#3b82f6;color:#fff;border:0;border-radius:12px;cursor:pointer;font-size:15px}
.send:disabled{opacity:.6;cursor:not-allowed}
footer{text-align:center;color:#687b96;font-size:11px;padding:0 10px 12px}
.status{color:#91a4bf;font-size:12px;min-height:16px;padding:0 20px 8px}
@media(max-width:650px){.sidebar{width:76px;padding:12px 8px}.logo{font-size:17px;text-align:center}.new-chat{font-size:11px;padding:10px 3px}.chat-area{padding:15px}.welcome h1{font-size:27px}.message{max-width:92%}.input-area{padding:12px}.send{padding:0 15px}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">NPC</div>
  <button class="new-chat" id="newChat">+ New Chat</button>
</aside>
<main class="main">
  <header>✦ <span>Silica AI</span></header>
  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <h1>Welcome to <span>Silica AI</span></h1>
      <p>Your intelligent AI assistant. Ask me anything!</p>
    </div>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <form class="input-area" id="chatForm">
    <input id="userInput" type="text" maxlength="4000" placeholder="Message Silica AI..." autocomplete="off" required>
    <button class="send" id="sendButton" type="submit">Send</button>
  </form>
  <footer>NPC • Silica AI</footer>
</main>
<script>
// Replace this with your deployed Cloudflare Worker URL.
// Example: https://silica-ai-api.YOUR-SUBDOMAIN.workers.dev
const API_URL = "PASTE_YOUR_CLOUDFLARE_WORKER_URL_HERE";

const chatArea = document.getElementById("chatArea");
const userInput = document.getElementById("userInput");
const chatForm = document.getElementById("chatForm");
const sendButton = document.getElementById("sendButton");
const statusEl = document.getElementById("status");

let history = [];

function addMessage(text, type) {
  const message = document.createElement("div");
  message.className = "message " + type;
  message.textContent = text;
  chatArea.appendChild(message);
  chatArea.scrollTop = chatArea.scrollHeight;
  return message;
}

function showWelcome() {
  chatArea.innerHTML = '<div class="welcome" id="welcome"><h1>Welcome to <span>Silica AI</span></h1><p>Your intelligent AI assistant. Ask me anything!</p></div>';
}

document.getElementById("newChat").addEventListener("click", () => {
  history = [];
  showWelcome();
  statusEl.textContent = "";
  userInput.value = "";
  userInput.focus();
});

chatForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = userInput.value.trim();
  if (!text) return;

  if (API_URL === "PASTE_YOUR_CLOUDFLARE_WORKER_URL_HERE") {
    statusEl.textContent = "Setup needed: add your Cloudflare Worker URL in index.html.";
    return;
  }

  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  addMessage(text, "user");
  history.push({ role: "user", text });
  userInput.value = "";
  sendButton.disabled = true;
  statusEl.textContent = "Silica AI is thinking...";

  const loading = addMessage("Thinking…", "ai");

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history.slice(-20) })
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(data.error || "The AI service could not answer. Please try again.");
    }
    if (!data.reply) throw new Error("The AI returned an empty reply.");

    loading.textContent = data.reply;
    history.push({ role: "model", text: data.reply });
    statusEl.textContent = "";
  } catch (error) {
    loading.textContent = "Sorry, I couldn't connect right now. " + error.message;
    history.pop(); // Remove the unanswered user turn so it can be retried.
    statusEl.textContent = "Connection problem";
  } finally {
    sendButton.disabled = false;
    userInput.focus();
    chatArea.scrollTop = chatArea.scrollHeight;
  }
});
</script>
</body>
</html>
