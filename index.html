<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPC | Silica AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#090d18;color:white;height:100vh;display:flex}
.sidebar{width:250px;background:#101727;padding:20px;border-right:1px solid #263249}
.logo{font-size:27px;font-weight:bold;color:#60a5fa;margin-bottom:35px}
.new-chat{width:100%;padding:13px;background:#1d2b43;color:white;border:1px solid #344967;border-radius:10px;cursor:pointer;font-size:15px}
.new-chat:hover{background:#293d5c}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:20px;border-bottom:1px solid #263249;font-size:20px;font-weight:bold}
header span,.welcome h1 span{color:#60a5fa}
.chat-area{flex:1;overflow-y:auto;padding:25px;display:flex;flex-direction:column;gap:18px}
.welcome{text-align:center;margin:auto}
.welcome h1{font-size:36px;margin-bottom:12px}
.welcome p{color:#9caec7}
.message{max-width:75%;padding:14px 18px;border-radius:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:#244d83}
.ai{align-self:flex-start;background:#182438;border:1px solid #2b3b54}
.input-area{padding:20px;border-top:1px solid #263249;display:flex;gap:10px}
input{flex:1;min-width:0;padding:16px;border:1px solid #344967;background:#121d30;color:white;border-radius:12px;outline:none;font-size:15px}
input:focus{border-color:#60a5fa}
.send{padding:0 23px;background:#3b82f6;color:white;border:0;border-radius:12px;cursor:pointer;font-size:15px}
.send:hover{background:#2563eb}
footer{text-align:center;color:#687b96;font-size:11px;padding:0 10px 12px}
@media(max-width:650px){.sidebar{width:75px;padding:12px 8px}.logo{font-size:17px;text-align:center}.new-chat{font-size:11px;padding:10px 3px}.chat-area{padding:15px}.welcome h1{font-size:27px}.message{max-width:90%}.input-area{padding:12px}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">NPC</div>
  <button class="new-chat" onclick="newChat()">+ New Chat</button>
</aside>
<main class="main">
  <header>✦ <span>Silica AI</span></header>
  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <h1>Welcome to <span>Silica AI</span></h1>
      <p>Your intelligent AI assistant. Ask me anything!</p>
    </div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Message Silica AI..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button class="send" onclick="sendMessage()">Send</button>
  </div>
  <footer>NPC • Silica AI</footer>
</main>
<script>
const chatArea=document.getElementById("chatArea");
const userInput=document.getElementById("userInput");
function addMessage(text,type){
  const message=document.createElement("div");
  message.className="message "+type;
  message.textContent=text;
  chatArea.appendChild(message);
  chatArea.scrollTop=chatArea.scrollHeight;
  return message;
}
function sendMessage(){
  const text=userInput.value.trim();
  if(!text)return;
  const welcome=document.getElementById("welcome");
  if(welcome)welcome.remove();
  addMessage(text,"user");
  userInput.value="";
  addMessage("Silica AI's interface is ready! Connect a secure AI backend to enable real AI answers.","ai");
}
function newChat(){
  chatArea.innerHTML='<div class="welcome" id="welcome"><h1>Welcome to <span>Silica AI</span></h1><p>Your intelligent AI assistant. Ask me anything!</p></div>';
  userInput.value="";
}
</script>
</body>
</html>
